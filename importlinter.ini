[importlinter]
root_package = plutus

[importlinter:contract:layers]
name = Domain layering (00_principles §3)
type = layers
layers =
    plutus.dashboard | plutus.api | plutus.alerts | plutus.scheduler
    plutus.swing | plutus.accumulation
    plutus.shared
    plutus.data | plutus.db
    plutus.config

[importlinter:contract:swing-accumulation-independence]
name = swing and accumulation never import each other
type = independence
modules =
    plutus.swing
    plutus.accumulation
