line-length = 100
target-version = "py311"
extend-exclude = ["src/plutus_legacy", "tests/_legacy_v1"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[lint.per-file-ignores]
"tests/**" = ["B011"]
# FastAPI uses Depends()/Query() in argument defaults by design.
"src/plutus/api/**" = ["B008"]
