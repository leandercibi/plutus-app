# Plutus material-event keyword prefilter
#
# All matches are case-insensitive substring matches against the headline text.
# Headline keeps if it matches ANY enabled tier AND no stoplist entry.
# Stoplist matches override tier matches and reject the headline.
#
# Enabled tiers are controlled by env var MATERIAL_KEYWORD_TIERS (default "A,B").
# Tier C is shipped here but disabled by default — set to "A,B,C" in .env to enable.
#
# Source/justification: keyword set was derived from a 2025–2026 NSE/BSE single-stock
# news survey (see specs/_CHANGE_SPEC.md §5 for the references). Each Tier A entry
# corresponds to a category that demonstrably moved at least one Indian stock 3%+
# in the cited period.
#
# Editing rules:
#   - Add new keywords by appending to the relevant tier list.
#   - Run "Promote keyword" from the dashboard's Rejected Headlines panel to find
#     candidates from real misses.
#   - After editing, restart plutus-main.service to clear the in-process cache.

