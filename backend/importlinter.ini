[importlinter]
root_package = plutus

[importlinter:contract:layers]
name = Domain layering (00_principles §3)
type = layers
layers =
    plutus.scheduler
    plutus.api
    plutus.dashboard | plutus.alerts
    plutus.swing | plutus.accumulation
    plutus.shared
    plutus.data
    plutus.db
    plutus.config
ignore_imports =
    # regime_builder bridges data providers → shared detector input type (spec 04/06)
    plutus.data.providers.regime_builder -> plutus.shared.regime.detector

[importlinter:contract:swing-accumulation-independence]
name = swing and accumulation never import each other
type = independence
modules =
    plutus.swing
    plutus.accumulation
