[project]
name = "plutus"
version = "2.0.0"
description = "Plutus v2 — single-operator NSE trading system"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyarrow>=15.0",
    "requests>=2.31",
    "yfinance>=0.2",
    "apscheduler>=3.10",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psycopg>=3.1",
    "smartapi-python>=1.5",
    "websocket-client>=1.6",
    "pyotp>=2.9",
    "logzero>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9,<2",
    "ruff>=0.4",
    "import-linter>=2.0",
    "hypothesis>=6.100",
    "freezegun>=1.4",
    "responses>=0.25",
    "pandas-stubs",
    "httpx2>=2.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["plutus*"]

[tool.setuptools.package-data]
plutus = ["data/*.csv"]
