[mypy]
python_version = 3.12
warn_unused_configs = True
ignore_missing_imports = True
plugins = pydantic.mypy

[mypy-plutus.shared.*]
strict = True

[mypy-plutus.swing.*]
strict = True

[mypy-plutus.accumulation.*]
strict = True

[mypy-plutus.config.*]
strict = True

# Legacy Streamlit dashboard — superseded by the React frontend. Excluded from
# type-checking (and from the pytest suite). Do not build new features here.
[mypy-plutus.dashboard.*]
ignore_errors = True
